[workspace]
resolver = "2"
members = ["engine/*", "game/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
mcv_core = { path = "game/mcv_core" }
mcv_assets = { path = "engine/mcv_assets" }
mcv_app = { path = "game/mcv_app" }
mcv_logic = { path = "game/mcv_logic" }
mcv_ffi = { path = "game/mcv_ffi" }
mcv_worldgen = { path = "game/mcv_worldgen" }
mcv_light = { path = "game/mcv_light" }
mcv_mesher = { path = "game/mcv_mesher" }
mcv_render = { path = "engine/mcv_render" }
mcv_ui = { path = "engine/mcv_ui" }
mcv_game = { path = "engine/mcv_game" }
mcv_ecs = { path = "engine/mcv_ecs" }
mcv_platform = { path = "engine/mcv_platform" }
mcv_save = { path = "engine/mcv_save" }
mcv_sync = { path = "engine/mcv_sync" }
mcv_entity = { path = "game/mcv_entity" }
mcv_item = { path = "game/mcv_item" }
mcv_audio = { path = "engine/mcv_audio" }

wgpu = "=30.0.1"
winit = { version = "=0.30.13", features = ["android-native-activity"] }
pollster = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
glam = "0.32"
log = "0.4"
env_logger = "0.11"
# mcv_audio 解析原版 sounds.json(事件名音效表)必需。
serde_json = "1"
image = "0.25"
cc = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
