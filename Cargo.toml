[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
mcv_core = { path = "crates/mcv_core" }
mcv_ffi = { path = "crates/mcv_ffi" }
mcv_worldgen = { path = "crates/mcv_worldgen" }
mcv_light = { path = "crates/mcv_light" }
mcv_mesher = { path = "crates/mcv_mesher" }
mcv_render = { path = "crates/mcv_render" }
mcv_game = { path = "crates/mcv_game" }
mcv_save = { path = "crates/mcv_save" }

wgpu = "=30.0.1"
winit = { version = "=0.30.13", features = ["android-native-activity"] }
pollster = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
glam = "0.32"
log = "0.4"
env_logger = "0.11"
cc = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
