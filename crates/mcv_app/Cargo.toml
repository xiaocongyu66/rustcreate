[package]
name = "mcv_app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "mcv"
path = "src/main.rs"

[dependencies]
log.workspace = true
env_logger.workspace = true
pollster.workspace = true
wgpu.workspace = true
winit.workspace = true
mcv_core.workspace = true
mcv_worldgen.workspace = true
mcv_game.workspace = true
mcv_render.workspace = true
mcv_save.workspace = true
mcv_ffi.workspace = true
mcv_light.workspace = true
mcv_item.workspace = true
mcv_mesher.workspace = true
mcv_entity.workspace = true
glam.workspace = true
bytemuck.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }

[package.metadata.android]
package = "win.rustcreate.mcv"
apk_name = "mcv"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34

[package.metadata.android.application]
label = "MCV"

[package.metadata.android.application.activity]
orientation = "sensorLandscape"
launch_mode = "singleTop"

[package.metadata.android.signing.release]
path = "release.keystore"
keystore_password = "mcvpass"
