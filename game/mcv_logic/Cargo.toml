[package]
name = "mcv_logic"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# 游戏层规则：不依赖 wgpu（GPU 上传经 mcv_render::gpu::MeshUploader），
# 也不依赖 winit（触屏事件翻译在引擎层 mcv_platform）。
log.workspace = true
glam.workspace = true
bytemuck.workspace = true
mcv_core.workspace = true
mcv_worldgen.workspace = true
mcv_light.workspace = true
mcv_mesher.workspace = true
mcv_render.workspace = true
mcv_platform.workspace = true
mcv_game.workspace = true
mcv_ecs.workspace = true
mcv_save.workspace = true
# #222 批 A：实体落盘走全仓共享 NBT 底座（只用不改）。
mcv_nbt.workspace = true
mcv_entity.workspace = true
mcv_item.workspace = true
mcv_audio.workspace = true

# 刀 5a（#115）：内存预算断言走 harness = false——stdout 不经测试
# harness 捕获，CI 绿跑也落日志，实测值（K5-MEAS 行）才可取证。
[[test]]
name = "memory_budget"
harness = false
