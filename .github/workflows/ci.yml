name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA dev headers (tinyaudio Linux backend)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Layering guard — game crates must not link wgpu/winit
        run: |
          # 引擎提供能力，游戏提供规则：除平台壳（mcv_app/mcv_desktop）外，
          # game/ 的任何 crate 都不得【直接】依赖 wgpu/winit——GPU/窗口一律经
          # engine/ 门面（mcv_render::gpu::MeshUploader / mcv_platform）。
          # depth 1 = 只看直接依赖：mcv_render/mcv_platform 内部含 wgpu/winit
          # 是允许的（它们是引擎），游戏层只能面向它们的 API。
          fail=0
          for p in mcv_logic mcv_core mcv_worldgen mcv_light mcv_mesher \
                   mcv_entity mcv_item; do
            deps=$(cargo tree -p "$p" -e normal,build --depth 1 --prefix none \
                   | awk '{print $1}' | sort -u)
            for bad in wgpu winit; do
              if echo "$deps" | grep -qx "$bad"; then
                echo "::error::$p 依赖了 $bad（游戏层必须经 engine 抽象）"
                fail=1
              fi
            done
          done
          exit $fail

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA dev headers (tinyaudio Linux backend)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # 全量原版音效树不入 git:test 前按 sha1 从 Mojang CDN 拉取,
      # 使 sounds_exist 的全树 ogg 校验真实发生。
      - name: Fetch vanilla sounds (sounds.json + ogg tree)
        run: bash ci/fetch-sounds.sh
      - run: cargo test --workspace --locked

  render-headless:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: gpu
      - name: Install lavapipe (software Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
      - name: Headless render tests
        env:
          MCV_SCREENSHOT_DIR: ${{ github.workspace }}
        run: cargo test -p mcv_render --features gpu-tests --locked
      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-screenshot
          path: |
            render-test.png
            overlay-test.png
          if-no-files-found: ignore
