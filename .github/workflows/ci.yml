name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA dev headers (tinyaudio Linux backend)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Android APK 线编译债前置（任务板 #84）：build.yml 的 android job 只在
      # push main 后才跑 cargo apk build（= mcv_app 及其依赖树，
      # aarch64-linux-android），Android-only 代码路径（android-activity 装配、
      # cfg(target_os="android") 块、wgpu Vulkan/GL 后端选择）的编译错只能等
      # main 构建红才暴露，修复周期被拉长。此处以 check 补洞：
      # - 包范围与 APK 线严格对齐：只 -p mcv_app（cargo apk build 在
      #   game/mcv_app 下构建的正是该包及其传递依赖）。桌面壳 mcv_desktop
      #   不在 APK 线里，不拉入 Android 目标编译制造无关红。
      # - 纯 check 不链接，无需 NDK 交叉链接器；android-activity 的 cc 胶水
      #   仅在 game-activity feature 下触发，本仓库走 native-activity，
      #   目标侧零 C 编译 → 只装 rustup target 即可，不引 setup-android-env.sh。
      - name: cargo check (aarch64-linux-android, APK line parity)
        run: cargo check --locked -p mcv_app --target aarch64-linux-android
      - name: Layering guard — game crates must not link wgpu/winit
        run: |
          # 引擎提供能力，游戏提供规则：除平台壳（mcv_app/mcv_desktop）外，
          # game/ 的任何 crate 都不得【直接】依赖 wgpu/winit——GPU/窗口一律经
          # engine/ 门面（mcv_render::gpu::MeshUploader / mcv_platform）。
          # depth 1 = 只看直接依赖：mcv_render/mcv_platform 内部含 wgpu/winit
          # 是允许的（它们是引擎），游戏层只能面向它们的 API。
          fail=0
          for p in mcv_logic mcv_core mcv_worldgen mcv_light mcv_mesher \
                   mcv_entity mcv_item; do
            deps=$(cargo tree -p "$p" -e normal,build --depth 1 --prefix none \
                   | awk '{print $1}' | sort -u)
            for bad in wgpu winit; do
              if echo "$deps" | grep -qx "$bad"; then
                echo "::error::$p 依赖了 $bad（游戏层必须经 engine 抽象）"
                fail=1
              fi
            done
          done
          exit $fail
      # NBT 底座外部依赖白名单守卫(任务板 #177):mcv_nbt 是全仓共享的通用
      # 序列化模块——零领域知识不仅指不 use mcv_* game 类型,也指外部依赖面
      # 必须最小。白名单:flate2(GZIP/ZLIB,纯 Rust 后端,原版 structure .nbt
      # 全为 GZIP 压缩,自写 inflate 不值)。新增外部依赖必须显式改本守卫。
      - name: mcv_nbt dependency whitelist guard
        run: |
          deps=$(cargo tree -p mcv_nbt -e normal,build --depth 1 --prefix none \
                 | awk '{print $1}' | sort -u | grep -v '^mcv_nbt$' || true)
          if echo "$deps" | grep -q '^mcv_'; then
            echo "::error::mcv_nbt 依赖了 mcv_* crate(NBT 底座必须零领域知识)"
            exit 1
          fi
          extra=$(echo "$deps" | grep -v -x 'flate2' || true)
          if [ -n "$extra" ]; then
            echo "::error::mcv_nbt 引入白名单外外部依赖: $extra"
            exit 1
          fi

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA dev headers (tinyaudio Linux backend)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # 全量原版音效树不入 git:test 前按 sha1 从 Mojang CDN 拉取,
      # 使 sounds_exist 的全树 ogg 校验真实发生。
      - name: Fetch vanilla sounds (sounds.json + ogg tree)
        run: bash ci/fetch-sounds.sh
      # 原版结构模板 .nbt 树(结构管线真件测试)。CDN 不可达时容许失败:
      # 测试侧按「资产目录在否」优雅 skip(打印 K-STRUCT skip 行)。
      - name: Fetch vanilla structures (.nbt tree, warn-allowed)
        run: bash ci/fetch-structures.sh || echo "::warning::fetch-structures 失败,结构测试走 skip 路径"
      # --no-fail-fast：单包红不再遮蔽后续包执行。registry 1618d1fc 已带
      # ore 锚定遮蔽叙事；#192 湖锁零执行证据事故同因：tip run 38416041644
      # fail-fast 停在 mcv_logic streaming.rs flap 后，mcv_worldgen 整包
      # 含湖锁/deepslate 三锁/cave_audit/golden 从未执行。
      # #209/#206 黑盒对拍 Rust 翼：RUST_DUMPOUT 门控 dump_for_java——
      # cave_audit 同窗 JGH1 逐 chunk 输出 + artifact（与 java-harness
      # 官方 jar dump 逐列矩阵对拍；未设 env 的例行跑零开销 no-op）。
      - name: JGH1 dump for java-harness parity
        run: cargo test -p mcv_worldgen --test dump_for_java --locked -- --nocapture
        env:
          # cargo test 的 cwd=crate 目录（game/mcv_worldgen）——相对路径会
          # 落到 crate 下而 artifact path 锚 workspace 根（实测 run
          # 38743002965 16 bin 出数但 artifact 空）——用绝对路径对齐：
          RUST_DUMPOUT: ${{ github.workspace }}/rust-dumpout
      - uses: actions/upload-artifact@v4
        with:
          name: rust-dumpout
          path: rust-dumpout/
      - run: cargo test --workspace --locked --no-fail-fast
      # #192 矿洞量化审计：K-CAVE-AUDIT 数值行常态入日志（默认模式 stdout
      # 被 cargo test 捕获、仅红时回显——「数据两用」需要基线随绿跑可见，
      # 供跨提交前后对照；包络断言随之照常执行）。
      - name: Cave quantitative audit (K-CAVE-AUDIT lines into log)
        run: cargo test -p mcv_worldgen --test cave_audit --locked -- --nocapture
      # #192 湖锁证据面：K-LAKES-BUF / K-LAKES attempts 数值行常态入日志
      # （同 cave_audit「数据两用」先例——绿跑也要能回帖 survivors/lava_in_band
      # 原文，不能只在红跑回显时可见）。
      - name: Lava lake audit (K-LAKES lines into log)
        run: cargo test -p mcv_worldgen --test lakes --locked -- --nocapture
      # 草原植被量化面：K-FLORA per-biome chunks/写数/id 直方图常态入
      # 日志（同 cave_audit/lakes 先例；期望收紧值以本打印为据回填）。
      - name: Land flora audit (K-FLORA lines into log)
        run: cargo test -p mcv_worldgen --test flora --locked -- --nocapture
      # rayon 收口（用户拍板 2026-10-17）：K-RAYON-GEN / K-RAYON-MESH 分段
      # 计时数值行常态入日志（同 K-CAVE-AUDIT「数据两用」先例——绿跑也
      # 可回帖数字，不能只在红跑回显）。量的是「串行直呼 vs 生产池装配
      # （TaskPool::shared = rayon 全局池 + 配额门）」两组，供分支
      # docs/rayon-switch.md 收账与 E0 分段计时（#155 观测面）交叉对照；
      # 产物一致性断言照常执行（不当纯 bench 跑）。
      - name: Rayon pool stage timings (K-RAYON lines into log)
        run: |
          cargo test -p mcv_worldgen --test rayon_perf_probe --locked -- --nocapture
          cargo test -p mcv_mesher --test rayon_perf_probe --locked -- --nocapture
  render-headless:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: gpu
      - name: Install lavapipe (software Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
      - name: Headless render tests
        env:
          MCV_SCREENSHOT_DIR: ${{ github.workspace }}
        run: cargo test -p mcv_render --features gpu-tests --locked
      # 真机 Mali 走 wgpu GLES 后端，而 lavapipe 恒 Vulkan——GLES 路径
      # （顶点属性 int→float、纹理数组拆分数组、sRGB 数组采样）过去在 CI
      # 从未执行过（gles_fallback_world_frame_smoke 拿不到 GL adapter 就
      # 静默 return，正是 2026-10-10 真机纯色事故的盲区）。llvmpipe 提供
      # EGL surfaceless GL。先以观察模式跑（continue-on-error）确认 runner
      # GL 栈稳定后删掉该行使 GLES 成为硬门禁。
      - name: GLES backend render tests (Mali device parity)
        continue-on-error: true
        env:
          WGPU_BACKEND: gles
        run: |
          sudo apt-get install -y libegl1 libgl1-mesa-dri
          cargo test -p mcv_render --features gpu-tests --locked -- \
            gles_ terrain_sky_and_hud_render grass_surface_contains_pattern_not_flat_tint frustum_cull_does_not_shift_chunk_origins water_pass_renders_uploaded_water_vertices first_person_hand_paints_bottom_right
      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-screenshot
          path: |
            render-test.png
            overlay-test.png
            water-pass-wet.png
            water-pass-dry.png
          if-no-files-found: ignore
