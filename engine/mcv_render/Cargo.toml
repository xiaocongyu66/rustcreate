[package]
name = "mcv_render"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
gpu-tests = []
# HDR 管线（#223 续）：RGBA16F 主纹理 + ACES tone mapping 后处理。
# 默认关（不破 CI/默认路）；桌面 feature-gate——开启后仍按运行期后端
# 判定（hdr::is_hdr_capable），GLES/Noop 强制回退现状 sRGB 链。
hdr = []

[dependencies]
mcv_core.workspace = true
mcv_assets.workspace = true
wgpu.workspace = true
glam.workspace = true
bytemuck.workspace = true
log.workspace = true
image.workspace = true

[dev-dependencies]
pollster.workspace = true
# 刀 5a（#115）：网格域字节实测走真 mcv_mesher 产线通路（纯测试依赖，
# 不反向进入游戏层——mcv_mesher 只依赖 mcv_core，无 wgpu/winit）。
mcv_mesher.workspace = true

# 网格域内存预算断言（#115 刀 5a）：harness = false——stdout 不经测试
# harness 捕获，CI 绿跑也落日志，实测值（K5-MEAS 行）才可取证；
# gpu-tests 关闭（workspace test job / lint）时整个 target 不参与构建。
[[test]]
name = "mesh_memory"
harness = false
required-features = ["gpu-tests"]

# 渲染内存治理波（①池预算 LRU 回收 ②重建瞬态放大）：同 mesh_memory 口径，
# K-MEM 行落日志取证，仅 render-headless（gpu-tests）构建。
[[test]]
name = "render_mem"
harness = false
required-features = ["gpu-tests"]
